<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perspective Studio</title>
    
    <!-- PWA Meta Tags -->
    <meta name="description" content="Be interested globally">
    <meta name="theme-color" content="#ffffff">
    
    <!-- Apple iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Perspective">
    
    <!-- Open Graph / Social Sharing -->
    <meta property="og:title" content="Perspective Studio">
    <meta property="og:description" content="Be interested globally">
    <meta property="og:type" content="website">
    
    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <canvas id="canvas"></canvas>
    <button id="download-strip" type="button" title="Download wallet strip image">Download Wallet Strip</button>
    <button id="download-background" type="button" title="Download wallet background image">Download Wallet Background</button>
    <div class="wallet-pass-dock">
        <button id="download-wallet-pass" type="button" title="Add to Apple Wallet or Google Wallet">
            <canvas id="wallet-pass-glass" aria-hidden="true"></canvas>
            <span class="wallet-pass-label">Add to Wallet</span>
        </button>
    </div>
    <!-- Section dialogs (mobile fallback / shared markup) -->
    <dialog id="dialog-info" class="section-dialog popup-window popup-window--editor" style="--popup-w: 700px; --popup-h: 600px;">
        <div class="popup-titlebar">
            <span class="popup-title">info.txt</span>
            <button class="dialog-close" aria-label="Close">&times;</button>
        </div>
        <iframe class="popup-frame" data-src="/info.html" title="info.txt"></iframe>
    </dialog>

    <dialog id="dialog-projects" class="section-dialog">
        <button class="dialog-close" aria-label="Close">&times;</button>
        <div class="dialog-content">
            <h2>Projects</h2>
            <p>Coming soon.</p>
        </div>
    </dialog>

    <dialog id="dialog-cv" class="section-dialog popup-window" style="--popup-w: 480px; --popup-h: 680px;">
        <div class="popup-titlebar">
            <span class="popup-title">CV.pdf</span>
            <a class="popup-action" href="/CV_Tian_2026.pdf" download="CV_Tian_2026.pdf" title="Download PDF">&#8595;</a>
            <button class="dialog-close" aria-label="Close">&times;</button>
        </div>
        <iframe class="popup-frame" data-src="/cv.html" title="CV.pdf"></iframe>
    </dialog>

    <script type="module" src="script.js"></script>
</body>
</html>
